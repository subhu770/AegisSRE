services:
  aegis-sre:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aegis-sre-engine
    ports:
      - "8000:8000"
    environment:
      - SIMULATION_MODE=true
      - PORT=8000
      - LOG_LEVEL=info
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
