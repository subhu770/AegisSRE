[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-sre"
version = "1.0.0"
description = "Autonomous Site Reliability Engineering (SRE) Multi-Agent Root-Cause Diagnosis Engine"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "AegisSRE Core Team", email = "platform-eng@company.internal" }
]
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "networkx>=3.2",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "asyncio: mark test as async"
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
